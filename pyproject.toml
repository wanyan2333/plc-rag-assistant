[project]
name = "plc-rag-assistant"
version = "0.1.0"
description = "RAG troubleshooting assistant for PLC technical manuals: hybrid retrieval, cited answers and validated JSON troubleshooting plans."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "chromadb>=1.0",
    "fastapi>=0.115",
    "google-genai>=2.28.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "streamlit>=1.38",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "reportlab>=4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
